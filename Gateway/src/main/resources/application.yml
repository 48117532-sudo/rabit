spring:
  application:
    name: gateway
  profiles:
    default: dev
  cloud:
    gateway:
      routes:
        - id: modulo-administracion
          uri: lb://modulo-administracion
          predicates:
            - Path=/auth/**, /administracion/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

---
spring:
  config:
    activate:
      on-profile: dev
    import: "configserver:http://localhost:8888"

---
spring:
  config:
    activate:
      on-profile: docker
    import: "configserver:http://configserver:8888"